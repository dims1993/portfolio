<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="VideoMaker is currently under development."
    />
    <title>VideoMaker — Working on it</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        color: #f4f4f5;
        background: #08090a;
      }

      main {
        position: relative;
        z-index: 1;
        width: min(90%, 42rem);
        padding: 3.5rem 2rem;
        text-align: center;
      }

      main::before,
      main::after {
        position: fixed;
        z-index: -1;
        width: 24rem;
        height: 24rem;
        content: "";
        border-radius: 999px;
        filter: blur(80px);
        opacity: 0.16;
      }

      main::before {
        top: -8rem;
        left: -8rem;
        background: #a78bfa;
      }

      main::after {
        right: -8rem;
        bottom: -8rem;
        background: #38bdf8;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 0.55rem;
        margin: 0 0 1.5rem;
        color: #a1a1aa;
        font-size: 0.72rem;
        font-weight: 800;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .dot {
        width: 0.55rem;
        height: 0.55rem;
        border-radius: 50%;
        background: #22c55e;
        box-shadow: 0 0 0 0.35rem rgba(34, 197, 94, 0.12);
      }

      h1 {
        margin: 0;
        font-size: clamp(2.7rem, 9vw, 5.5rem);
        line-height: 0.95;
        letter-spacing: -0.075em;
      }

      p {
        max-width: 31rem;
        margin: 1.5rem auto 2.25rem;
        color: #a1a1aa;
        font-size: clamp(1rem, 2vw, 1.125rem);
        line-height: 1.65;
      }

      a {
        display: inline-flex;
        align-items: center;
        gap: 0.65rem;
        padding: 0.9rem 1.2rem;
        border: 1px solid rgba(226, 232, 240, 0.24);
        border-radius: 0.8rem;
        color: #e2e8f0;
        font-size: 0.72rem;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-decoration: none;
        text-transform: uppercase;
        transition: background 180ms ease, color 180ms ease, transform 180ms ease;
      }

      a:hover {
        color: #08090a;
        background: #e2e8f0;
        transform: translateY(-2px);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow"><span class="dot"></span> VideoMaker</div>
      <h1>Working on it.</h1>
      <p>
        VideoMaker is still being built. Check back soon to see the project in action.
      </p>
      <a href="/">Back to portfolio <span aria-hidden="true">→</span></a>
    </main>
  </body>
</html>
